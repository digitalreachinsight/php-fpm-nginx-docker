version: 2.1

orbs:
  docker: circleci/docker@4.0.1

jobs:
  build:
    docker:
      - image: cimg/base:current
    steps:
      - checkout

      # 1. Spin up the remote Docker environment
      - setup_remote_docker:
          version: default
          docker_layer_caching: true

      # 2. Generate custom timestamp: YYYY.MM.DD.SECONDS.MILLISECONDS
      - run:
          name: Generate Custom Build Timestamp Tag
          command: |
            CUSTOM_BUILD_NUM=$(date +%Y.%m.%d.%s.%3N)
            echo "Generated Build Tag: $CUSTOM_BUILD_NUM"
            echo "export BUILD_NUM=$CUSTOM_BUILD_NUM" >> $BASH_ENV

      # 3. Authenticate and check connection to GitHub Container Registry
      - docker/check:
          registry: ghcr.io
          docker-username: GHCR_USERNAME
          docker-password: GHCR_PASSWORD

      # 4. Build and Push the Docker image to GHCR using the custom timestamp
      - run:
          name: Build and Push Docker Image to GHCR
          command: |
            # GitHub Container Registry requires lowercase owner and repo names
            GH_OWNER=$(echo "$CIRCLE_PROJECT_USERNAME" | tr '[:upper:]' '[:lower:]')
            REPO_NAME=$(echo "$CIRCLE_PROJECT_REPONAME" | tr '[:upper:]' '[:lower:]')
            
            IMAGE_BASE="ghcr.io/$GH_OWNER/$REPO_NAME"
            
            echo "Building image: $IMAGE_BASE:$BUILD_NUM"
            docker build -t "$IMAGE_BASE:$BUILD_NUM" -t "$IMAGE_BASE:latest" .
            
            echo "Pushing image to GHCR..."
            docker push "$IMAGE_BASE:$BUILD_NUM"
            docker push "$IMAGE_BASE:latest"

workflows:
  version: 2.1
  ghcr-build-workflow:
    jobs:
      - build:
          filters:
            branches:
              only: main
