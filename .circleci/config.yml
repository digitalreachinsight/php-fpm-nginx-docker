version: 2.1

jobs:
  build_and_push:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      
      # 1. Enable remote docker if your pipeline builds docker images
      - setup_remote_docker:
          version: default

      # 2. Generate the custom date-based build number and export it
      - run:
          name: Set Custom Build Timestamp Tag
          command: |
            # Format: YYYY.MM.DD.SECONDS.MILLISECONDS
            # %s gives total seconds since epoch for global uniqueness
            CUSTOM_BUILD_NUM=$(date +%Y.%m.%d.%s.%3N)
            
            echo "Generated custom tag: $CUSTOM_BUILD_NUM"
            
            # Export to $BASH_ENV so it persists across steps in this job
            echo "export BUILD_NUM=$CUSTOM_BUILD_NUM" >> $BASH_ENV

      # 3. Use the $BUILD_NUM variable in your Docker build/tag commands
      - run:
          name: Build and Tag Docker Image
          command: |
            echo "Building image with tag: $BUILD_NUM"
            
            # Example using it to tag your image:
            docker build -t digitalreachinsight/php-fpm-nginx-docker:$BUILD_NUM .
            
            # Or passing it as a build argument to your Dockerfile:
            # docker build --build-arg BUILD_DATE=$BUILD_NUM -t digitalreachinsight/php-fpm-nginx-docker:latest .

      # 4. (Optional) Push the image to Docker Hub or ECR
      - run:
          name: Push Docker Image
          command: |
            # docker push digitalreachinsight/php-fpm-nginx-docker:$BUILD_NUM
