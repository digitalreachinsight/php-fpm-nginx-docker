version: 2.1

# Import the official CircleCI Docker orb to simplify builds and pushes -ee
orbs:
  docker: circleci/docker@2.8.2

jobs:
  build-and-push:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - run:
          name: Generate Custom Build Date Number
          command: |
            # Generate format: YYYY.MM.DD.SECONDS.MILLISECONDS
            # Using %s for total seconds since epoch, or change to %S for seconds of the minute
            CUSTOM_BUILD_NUM=$(date +%Y.%m.%d.%s.%3N)
            
            echo "Generated Build Number: $CUSTOM_BUILD_NUM"
            
            # Persist the variable for subsequent steps in this job
            echo "export BUILD_NUM=$CUSTOM_BUILD_NUM" >> $BASH_ENV
      - run:
          name: Use Custom Build Number
          command: |
            echo "The current build identifier is: $BUILD_NUM"
      
      - setup_remote_docker:
          docker_layer_caching: true

      # Fixed: Corrected parameter names to 'docker-username' and 'docker-password'
      - docker/check:
          registry: ghcr.io
          docker-username: GHCR_USERNAME
          docker-password: GHCR_PASSWORD

      - docker/build:
          registry: ghcr.io
          image: digitalreachinsight/php-fpm-nginx-docker
          tag: "latest,nightly-${CUSTOM_BUILD_NUM}"
          
      - docker/push:
          registry: ghcr.io
          image: digitalreachinsight/php-fpm-nginx-docker
          tag: "latest,nightly-${CUSTOM_BUILD_NUM}"

workflows:
  nightly-build:
    triggers:
      - schedule:
          cron: "0 0 * * *"
          filters:
            branches:
              only:
                - main
    jobs:
      - build-and-push

  manual-push-build:
    jobs:
      - build-and-push:
          filters:
            branches:
              only:
                - main
