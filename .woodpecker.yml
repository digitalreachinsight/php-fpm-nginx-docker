when:
  - event: [push, pull_request]

steps:
  - name: calculate-tags
    image: alpine
    commands:
      - FORMATTED_DATE=$(date -ud @${CI_PIPELINE_CREATED} '+%Y.%m.%d.%H.%M.%S')
      # Kaniko looks for a file named exactly ".tags" in the root directory
      - echo "latest,$${FORMATTED_DATE}" > .tags
      - cat .tags

  # Step 1: Build and Push the container image
  - name: build-and-push-image
    image: woodpeckerci/plugin-kaniko:1
    settings:
      dockerfile: Dockerfile
      repo: digitalreachinsight/php-fpm-nginx-docker            
      
      # FIX: Remove the 'tags:' configuration line entirely.
      # Leaving it blank tells Kaniko to read from your .tags file natively.
      
      dry_run: ${{eq CI_PIPELINE_EVENT "pull_request"}}
      registry: ghcr.io

      username:
        from_secret: registry_username
      password:
        from_secret: registry_password
