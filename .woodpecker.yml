when:
  - event: [push, pull_request]

steps:
  # Step 1: Build and Push the container image
  - name: build-and-push-image
    image: woodpeckerci/plugin-kaniko:1
    settings:
      dockerfile: Dockerfile
      repo: digitalreachinsight/php-fpm-nginx-docker
      tags: latest
      # Dynamically sets dry_run to true for Pull Requests, and false for branch pushes
      dry_run: ${CI_PIPELINE_EVENT} == "pull_request"

      # Generates both tags simultaneously for your registry
      tags: |        
        raw -t latest
        cron -f %Y.%m.%d.%H.%M.%S
      
      # Optional: Uncomment the line below if you are using GitHub Packages (GHCR) instead of Docker Hub
      registry: ghcr.io

      #
     # Correct secret mapping syntax for the Kaniko Plugin:
      username:
        from_secret: registry_username
      password:
        from_secret: registry_password
