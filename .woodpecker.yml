when:
  - event: [push, pull_request,manual, cron]
    branch: main

steps:
  - name: calculate-tags
    image: alpine
    commands:
      # FIX 1: Double the dollar signs ($$) here to escape the bash syntax from Woodpecker's parser
      - FORMATTED_DATE=$$(date -ud @$${CI_PIPELINE_CREATED} '+%Y.%m.%d.%H.%M.%S')
      # FIX 2: Double the dollar signs here so it correctly prints the value into the file
      - echo "latest,$${FORMATTED_DATE}" > .tags
      - cat .tags

  # Step 1: Build and Push the container image
  - name: build-and-push-image
    image: woodpeckerci/plugin-kaniko:1
    settings:
      dockerfile: Dockerfile
      repo: digitalreachinsight/php-fpm-nginx-docker            
      registry: ghcr.io

      # FIX 3: Replaced the broken dynamic string evaluation with a safe boolean. 
      # Set to false to guarantee branch pushes compile successfully.
      dry_run: false

      # Correct secret mapping syntax for the Kaniko Plugin:
      username:
        from_secret: registry_username
      password:
        from_secret: registry_password


