when:
  - event: [push, pull_request]

steps:
  - name: calculate-tags
    image: alpine
    commands:
      - FORMATTED_DATE=$(date -ud @${CI_PIPELINE_CREATED} '+%Y.%m.%d.%H.%M.%S')
      # Natively registers both tags inside Kaniko without exposing variables to envsubst
      - echo "latest,$${FORMATTED_DATE}" > .tags
      - cat .tags

  # Step 1: Build and Push the container image
  - name: build-and-push-image
    image: woodpeckerci/plugin-kaniko:1
    settings:
      dockerfile: Dockerfile
      repo: digitalreachinsight/php-fpm-nginx-docker            
      registry: ghcr.io

      # FIX: Clean Woodpecker template function to evaluate true/false safely
      dry_run: ${{eq CI_PIPELINE_EVENT "pull_request"}}

      # Correct secret mapping syntax for the Kaniko Plugin:
      username:
        from_secret: registry_username
      password:
        from_secret: registry_password
